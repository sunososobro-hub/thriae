<title id="t">Pains and cures</title>
<desc id="d">Four pains on the left: the same mistake again, a rules file that keeps growing, agents that collide, private data that leaks. Four cures on the right: one file for any tool, every rule has evidence, dead rules are removed, a leak guard is built in.</desc>
