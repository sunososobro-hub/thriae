<text x="670" y="52" font-family="Helvetica, Arial, 'Segoe UI Emoji', 'Apple Color Emoji', 'Noto Color Emoji', sans-serif" font-size="22" fill="rgb(170,110,20)" text-anchor="middle" font-weight="bold">🍯 with Thriae</text>
