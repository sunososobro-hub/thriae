<title id="t">How a rule grows</title>
<desc id="d">A cycle: a failure becomes a lesson with evidence; when 3 projects confirm it, it becomes a rule; when it stops helping, it is removed. You are here: seed rules from 1 pipeline, waiting for 3 projects to confirm.</desc>
