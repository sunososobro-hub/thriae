<text x="749.8063897255945" y="192.5572809000084" font-family="Helvetica, Arial, 'Segoe UI Emoji', 'Apple Color Emoji', 'Noto Color Emoji', sans-serif" font-size="18" fill="rgb(42,36,24)" text-anchor="middle" font-weight="bold">lesson</text>
