name: lesson-gate

# Scans every issue title and body with hive/scripts/leak_check.py. A hit rejects
# the whole issue: fixed bilingual comment (never quotes the text), label
# rejected:leak, close, lock. The issue text reaches the scanner as environment
# variables only (never interpolated into a shell string) and is never executed.
# The scanner is checked out from the default branch. Not pull_request_target.
# Limit: the built-in token cannot delete an issue, so a real secret stays visible
# in the issue history until a maintainer deletes it; revoke any such secret.
on:
  issues:
    types: [opened, edited]

permissions:
  issues: write
  contents: read

jobs:
  gate:
    runs-on: ubuntu-latest
    env:
      LEAK_BLOCKLIST: ${{ secrets.LEAK_BLOCKLIST }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - name: Scan issue
        id: scan
        env:
          ISSUE_TITLE: ${{ github.event.issue.title }}
          ISSUE_BODY: ${{ github.event.issue.body }}
        run: |
          set +e
          python3 hive/scripts/lesson_gate.py --message "$RUNNER_TEMP/reject.md"
          rc=$?
          set -e
          if [ "$rc" -eq 10 ]; then echo "reject=true" >> "$GITHUB_OUTPUT"; exit 0; fi
          exit "$rc"
      - name: Reject, label, close and lock
        if: steps.scan.outputs.reject == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          REPO: ${{ github.repository }}
        run: |
          gh label create "rejected:leak" --repo "$REPO" --color b60205 \
            --description "Rejected by the leak gate" --force
          gh issue comment "$ISSUE_NUMBER" --repo "$REPO" --body-file "$RUNNER_TEMP/reject.md"
          gh issue edit "$ISSUE_NUMBER" --repo "$REPO" --add-label "rejected:leak"
          gh issue close "$ISSUE_NUMBER" --repo "$REPO" --reason "not planned"
          gh issue lock "$ISSUE_NUMBER" --repo "$REPO" --reason spam
