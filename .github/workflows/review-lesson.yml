name: review-lesson

# KEEPER-ONLY: this workflow lives in the private keeper repo and must not be published
# (the model secret stays private). It reviews lesson issues on a target repo on a schedule.
# Target = repo variable THRIAE_TARGET_REPO, default: the repo this workflow runs in.
# Issue title and body are untrusted data: they only travel through files, never through a
# shell line or a workflow expression.
# Three jobs, split on purpose:
#   select: target token (read), NO model secret. Lists open lesson issues without a review:*
#           label, or edited after the reviewer's last comment (max 5, oldest first).
#   review: model secret, NO target token, contents read only, model has no tools.
#           Output: validated verdict JSON (artifact).
#   post:   target token (issues write), NO model secret. Re-validates, posts ONE comment
#           + one review:* label per issue with a plain script.
# Never edits AGENTS.md. Never checks out code from an issue. Runs from the default branch.
# Target token: GITHUB_TOKEN when target == this repo, else secret THRIAE_TARGET_TOKEN
# (fine-grained PAT, Issues read/write on the target only).
on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:
    inputs:
      issue:
        description: "Optional: review only this issue number (even if already reviewed)"
        required: false
        type: string

permissions: {}

concurrency:
  group: review-lesson
  cancel-in-progress: false

jobs:
  select:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      issues: read
    env:
      GITHUB_REPOSITORY: ${{ vars.THRIAE_TARGET_REPO || github.repository }}
      GITHUB_TOKEN: ${{ (vars.THRIAE_TARGET_REPO && vars.THRIAE_TARGET_REPO != github.repository) && secrets.THRIAE_TARGET_TOKEN || github.token }}
      ONLY: ${{ inputs.issue }}
    outputs:
      count: ${{ steps.sel.outputs.count }}
    steps:
      - name: Check target token
        id: tok
        run: |
          if [ -z "$GITHUB_TOKEN" ]; then
            echo "::notice::target token not set (add THRIAE_TARGET_TOKEN); nothing posted"
            echo "ok=false" >> "$GITHUB_OUTPUT"
          else
            echo "ok=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@v4
        if: steps.tok.outputs.ok == 'true'
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        if: steps.tok.outputs.ok == 'true'
        with:
          python-version: "3.12"
      - name: Select issues that need a review (data only)
        id: sel
        env:
          TOKEN_OK: ${{ steps.tok.outputs.ok }}
        run: |
          if [ "$TOKEN_OK" != "true" ]; then echo "count=0" >> "$GITHUB_OUTPUT"; exit 0; fi
          case "$ONLY" in *[!0-9]*) echo "bad issue number"; exit 1 ;; esac
          if [ -n "$ONLY" ]; then python -I hive/scripts/review_lesson.py --select issues.json --only "$ONLY"
          else python -I hive/scripts/review_lesson.py --select issues.json; fi
          n=$(python -I -c "import json;print(len(json.load(open('issues.json'))))")
          echo "count=$n" >> "$GITHUB_OUTPUT"
          if [ "$n" = "0" ]; then echo "nothing to review"; fi
      - uses: actions/upload-artifact@v4
        if: steps.sel.outputs.count != '0'
        with:
          name: issues
          path: issues.json
          if-no-files-found: error

  review:
    needs: select
    if: needs.select.outputs.count != '0'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    outputs:
      ok: ${{ steps.check.outputs.ok }}
    steps:
      - name: Check reviewer secret
        id: check
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
        run: |
          [ -n "$ANTHROPIC_API_KEY" ] && echo "api=true" >> "$GITHUB_OUTPUT" || echo "api=false" >> "$GITHUB_OUTPUT"
          if [ -z "$ANTHROPIC_API_KEY" ] && [ -z "$CLAUDE_CODE_OAUTH_TOKEN" ]; then
            echo "::notice::reviewer secret not set (add CLAUDE_CODE_OAUTH_TOKEN or ANTHROPIC_API_KEY); nothing posted"
            echo "ok=false" >> "$GITHUB_OUTPUT"
          else
            echo "ok=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@v4
        if: steps.check.outputs.ok == 'true'
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        if: steps.check.outputs.ok == 'true'
        with:
          python-version: "3.12"
      - uses: actions/download-artifact@v4
        if: steps.check.outputs.ok == 'true'
        with:
          name: issues
      - uses: actions/setup-node@v4
        if: steps.check.outputs.ok == 'true' && steps.check.outputs.api == 'false'
        with:
          node-version: "22"
      - name: Install Claude Code CLI (OAuth path only)
        if: steps.check.outputs.ok == 'true' && steps.check.outputs.api == 'false'
        env:
          CLI_PKG: "@anthropic-ai/claude-code"
          CLI_VERSION: "2.1.325"
        run: npm install -g "${CLI_PKG}@${CLI_VERSION}"
      - name: Review (model has no tools, returns JSON only)
        if: steps.check.outputs.ok == 'true'
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
        run: python -I hive/scripts/review_lesson.py --review-batch issues.json --out verdicts.json
      - uses: actions/upload-artifact@v4
        if: steps.check.outputs.ok == 'true'
        with:
          name: verdict
          path: verdicts.json
          if-no-files-found: error

  post:
    needs: review
    if: needs.review.outputs.ok == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      issues: write
    env:
      GITHUB_REPOSITORY: ${{ vars.THRIAE_TARGET_REPO || github.repository }}
      GITHUB_TOKEN: ${{ (vars.THRIAE_TARGET_REPO && vars.THRIAE_TARGET_REPO != github.repository) && secrets.THRIAE_TARGET_TOKEN || github.token }}
    steps:
      - name: Check target token
        id: tok
        run: |
          if [ -z "$GITHUB_TOKEN" ]; then
            echo "::notice::target token not set (add THRIAE_TARGET_TOKEN); nothing posted"
            echo "ok=false" >> "$GITHUB_OUTPUT"
          else
            echo "ok=true" >> "$GITHUB_OUTPUT"
          fi
      # Script and prompt come from the default branch, never from the issue.
      - uses: actions/checkout@v4
        if: steps.tok.outputs.ok == 'true'
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v4
        if: steps.tok.outputs.ok == 'true'
        with:
          name: verdict
      - name: Post comments and labels
        if: steps.tok.outputs.ok == 'true'
        run: python -I hive/scripts/review_lesson.py --post verdicts.json
